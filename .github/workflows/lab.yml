name: query lab

on:
  push:
  pull_request:

jobs:
  lab:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lab
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LAB_DSN: postgresql://postgres:postgres@localhost:5432/lab
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: psql -h localhost -U postgres -d lab -q -f setup_data.sql   # ~1 minute
      - run: pytest -q
      - run: python lab.py
